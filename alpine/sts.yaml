apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alpine
  namespace: commissions-core
spec:
  selector:
    matchLabels:
      app: alpine
  template:
    metadata:
      labels:
        app: alpine
    spec:
      containers:
        - name: alpine
          image: docker.io/alpine/curl:8.22.0
          command: ["sleep", "infinity"]
